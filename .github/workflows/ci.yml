name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Validate fixtures
        run: |
          sclite validate examples/security-contract-proof
          sclite validate-artifact --schema prepared_execution_spec.v0.1 examples/prepared-execution-spec/prepared_execution_spec.json
          sclite validate-artifact --schema redacted_prepared_execution_spec.v0.1 examples/security-contract-proof/prepared_execution_spec.redacted.json
          sclite validate-artifact --schema scope_fidelity_report.v0.1 examples/scope-fidelity-report/scope_fidelity_report.json
          sclite validate-artifact --schema redaction_policy.v0.1 examples/redaction-policy/redaction_policy.json
          sclite validate-artifact --schema redaction_receipt.v0.1 examples/redaction-receipt/redaction_receipt.json
          sclite validate-artifact --schema public_validation_surface_index.v0.1 examples/public-validation-surface-index/public_validation_surface_index.json
          sclite validate-artifact --schema public_snapshot_manifest.v0.1 examples/public-snapshot-manifest/public_snapshot_manifest.json
          sclite hash-artifact --schema approved_execution_spec.v0.1 examples/security-contract-proof/approved_execution_spec.json
          sclite validate-chain sclite/examples/contract-lifecycle-v0.2/artifact_chain_manifest.json
          sclite verify-lifecycle sclite/examples/contract-lifecycle-v0.2/artifact_chain_manifest.json
          sclite redaction-policy | python -m json.tool >/dev/null
          sclite validation-surface-index | python -m json.tool >/dev/null
          sclite snapshot-manifest --file examples/security-contract-proof/approved_execution_spec.json | python -m json.tool >/dev/null
          sclite scope-fidelity --approved-spec examples/security-contract-proof/approved_execution_spec.json --fail-on review
          sclite validation-receipt examples/security-contract-proof
      - name: Run tests
        run: python -m pytest -q
