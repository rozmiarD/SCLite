name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade -r .github/release-build-requirements.txt
      - run: python -m pip install -r .github/release-requirements.txt
      - run: python -m pip install -r .github/release-test-requirements.txt
      - name: Full source security gate
        run: scripts/dev_gate.sh
      - name: Dependency audit
        run: |
          python -m pip_audit
          mkdir -p release-evidence
          cyclonedx-py environment --output-file release-evidence/sclite-core.cdx.json
      - name: Package smoke and reproducibility
        run: |
          scripts/package_smoke.sh
          scripts/reproducible_build_gate.sh
      - run: python -m build
      - run: scripts/normalize_sdist.sh dist/*.tar.gz
      - run: python -m twine check dist/*
      - name: Bind tag to package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Require approved external review for stable tags
        if: ${{ !contains(github.ref_name, 'rc') }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/validate_external_review.py --stable \
            --source-commit "${GITHUB_SHA}" --release-line "${VERSION}" \
            --artifact dist/*.whl --artifact dist/*.tar.gz
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
