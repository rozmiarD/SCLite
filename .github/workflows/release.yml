name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - name: Resolve exact source commit
        run: |
          if [[ "${GITHUB_REF_NAME}" == *rc* ]]; then
            SOURCE_COMMIT="${GITHUB_SHA}"
          else
            SOURCE_COMMIT=$(python scripts/validate_release_record_commit.py --review-commit "${GITHUB_SHA}")
          fi
          git checkout --detach "${SOURCE_COMMIT}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r .github/release-test-requirements.txt
      - run: scripts/dev_gate.sh

  publish:
    needs: verify-source
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - name: Resolve reviewed source and preserve review record
        id: source
        run: |
          if [[ "${GITHUB_REF_NAME}" == *rc* ]]; then
            SOURCE_COMMIT="${GITHUB_SHA}"
          else
            SOURCE_COMMIT=$(python scripts/validate_release_record_commit.py --review-commit "${GITHUB_SHA}")
            cp security/EXTERNAL_REVIEW.json "${RUNNER_TEMP}/EXTERNAL_REVIEW.json"
            echo "review_record=${RUNNER_TEMP}/EXTERNAL_REVIEW.json" >>"${GITHUB_OUTPUT}"
          fi
          echo "source_commit=${SOURCE_COMMIT}" >>"${GITHUB_OUTPUT}"
          git checkout --detach "${SOURCE_COMMIT}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade -r .github/release-build-requirements.txt
      - run: python -m pip install -r .github/release-requirements.txt
      - name: Dependency audit and SBOM
        run: |
          python -m pip_audit
          mkdir -p release-evidence
          cyclonedx-py environment --output-file release-evidence/sclite-core.cdx.json
      - name: Package smoke and reproducibility
        run: |
          scripts/package_smoke.sh
          scripts/reproducible_build_gate.sh
      - run: python -m build
      - run: scripts/normalize_sdist.sh dist/*.tar.gz
      - run: python -m twine check dist/*
      - name: Bind tag to source package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Require approved external review for stable tags
        if: ${{ !contains(github.ref_name, 'rc') }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/validate_external_review.py --stable \
            --record "${{ steps.source.outputs.review_record }}" \
            --source-commit "${{ steps.source.outputs.source_commit }}" \
            --release-line "${VERSION}" \
            --artifact dist/*.whl --artifact dist/*.tar.gz
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
