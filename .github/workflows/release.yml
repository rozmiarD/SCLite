name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Resolve exact source commit
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REVIEW_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          else
            REVIEW_COMMIT="${GITHUB_SHA}"
          fi
          if [[ "${RELEASE_TAG}" == *rc* ]]; then
            SOURCE_COMMIT="${REVIEW_COMMIT}"
          else
            SOURCE_COMMIT=$(python scripts/validate_release_record_commit.py --review-commit "${REVIEW_COMMIT}")
          fi
          git checkout --detach "${SOURCE_COMMIT}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r .github/release-test-requirements.txt
      - run: scripts/dev_gate.sh
      - run: python -m ruff check .
      - run: python -m mypy
      - run: node scripts/verify_vectors.mjs conformance/sclite-2.0-vectors.json

  publish:
    needs: verify-source
    environment: pypi
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1704067200'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Resolve reviewed source and preserve review record
        id: source
        run: |
          cp .github/release-requirements.txt "${RUNNER_TEMP}/release-requirements.txt"
          echo "audit_requirements=${RUNNER_TEMP}/release-requirements.txt" >>"${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            cp security/EXTERNAL_REVIEW_RECOVERY.json "${RUNNER_TEMP}/EXTERNAL_REVIEW.json"
            echo "review_record=${RUNNER_TEMP}/EXTERNAL_REVIEW.json" >>"${GITHUB_OUTPUT}"
            REVIEW_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          else
            REVIEW_COMMIT="${GITHUB_SHA}"
          fi
          if [[ "${RELEASE_TAG}" == *rc* ]]; then
            SOURCE_COMMIT="${REVIEW_COMMIT}"
          else
            SOURCE_COMMIT=$(python scripts/validate_release_record_commit.py --review-commit "${REVIEW_COMMIT}")
            git checkout --detach "${REVIEW_COMMIT}"
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              cp security/EXTERNAL_REVIEW.json "${RUNNER_TEMP}/EXTERNAL_REVIEW.json"
              echo "review_record=${RUNNER_TEMP}/EXTERNAL_REVIEW.json" >>"${GITHUB_OUTPUT}"
            fi
          fi
          echo "source_commit=${SOURCE_COMMIT}" >>"${GITHUB_OUTPUT}"
          echo "review_commit=${REVIEW_COMMIT}" >>"${GITHUB_OUTPUT}"
          git checkout --detach "${SOURCE_COMMIT}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade -r .github/release-build-requirements.txt
      - run: python -m pip install -r "${{ steps.source.outputs.audit_requirements }}"
      - name: Dependency audit and SBOM
        run: |
          python -m pip_audit
          mkdir -p release-evidence
          cyclonedx-py environment --output-file release-evidence/sclite-core.cdx.json
      - name: Package smoke and reproducibility
        run: |
          scripts/package_smoke.sh
          scripts/reproducible_build_gate.sh
      - name: Build reviewed source artifacts
        run: |
          rm -rf dist build *.egg-info
          python -m build
          scripts/normalize_sdist.sh dist/*.tar.gz
          python -m twine check dist/*
          mkdir -p "${RUNNER_TEMP}/reviewed-dist"
          cp dist/*.whl dist/*.tar.gz "${RUNNER_TEMP}/reviewed-dist/"
      - name: Build tagged record commit and prove artifact equality
        if: ${{ !contains(env.RELEASE_TAG, 'rc') }}
        run: |
          git checkout --detach "${{ steps.source.outputs.review_commit }}"
          rm -rf dist build *.egg-info
          python -m build
          scripts/normalize_sdist.sh dist/*.tar.gz
          python -m twine check dist/*
          python scripts/compare_release_builds.py \
            --reviewed "${RUNNER_TEMP}/reviewed-dist" \
            --published dist
      - name: Bind tag to source package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${RELEASE_TAG}" = "v${VERSION}"
      - name: Require approved external review for stable tags
        if: ${{ !contains(env.RELEASE_TAG, 'rc') }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/validate_external_review.py --stable \
            --record "${{ steps.source.outputs.review_record }}" \
            --source-commit "${{ steps.source.outputs.source_commit }}" \
            --release-line "${VERSION}" \
            --artifact dist/*.whl --artifact dist/*.tar.gz
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          subject-path: 'dist/*'
      - name: Write recovery provenance predicate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          REVIEW_COMMIT: ${{ steps.source.outputs.review_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          predicate = {
              "schema": "sclite.release_recovery_provenance.v1",
              "release_tag": os.environ["RELEASE_TAG"],
              "reviewed_source_commit": os.environ["SOURCE_COMMIT"],
              "release_record_commit": os.environ["REVIEW_COMMIT"],
              "recovery_workflow_commit": os.environ["WORKFLOW_COMMIT"],
              "record_only_parent_verified": True,
              "artifact_equality_verified": True,
          }
          path = Path("release-evidence/recovery-provenance.json")
          path.write_text(json.dumps(predicate, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          subject-path: 'dist/*'
          predicate-type: 'https://sclite.dev/attestations/release-recovery/v1'
          predicate-path: 'release-evidence/recovery-provenance.json'
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
