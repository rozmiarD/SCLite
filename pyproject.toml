[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sclite"
version = "0.1.0"
description = "Lightweight Security Contract Layer artifacts, validation, and public-safe proof fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ravenclaw Security Contract Layer maintainers" }]
keywords = ["security", "contracts", "validation", "evidence", "governance"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
sclite = "sclite.cli:main"
scl = "sclite.cli:main"

[tool.setuptools]
packages = ["sclite"]
include-package-data = true

[tool.setuptools.package-data]
sclite = [
  "schemas/*.json",
  "examples/security-contract-proof/*.json",
  "examples/security-contract-proof/*.md",
  "examples/scope-fidelity-report/*.json",
  "examples/scope-fidelity-report/*.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
